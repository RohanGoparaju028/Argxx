name: CI & Security Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  formatting:
    name: Code Formatting (clang-format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format

      - name: Check code formatting
        run: |
          clang-format --dry-run --Werror *.cpp *.hpp

  security-checks:
    name: Security & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck

      - name: Run cppcheck security scan
        run: |
          cppcheck --enable=warning,performance,portability,style \
                   --error-exitcode=1 \
                   --inline-suppr \
                   --suppress=missingInclude \
                   --suppress=missingIncludeSystem \
                   --suppress=unusedFunction \
                   *.cpp *.hpp

      - name: Secret leak prevention check
        run: |
          echo "Verifying no credentials or .env files are tracked in git..."
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::Security alert: .env file is tracked in git repository!"
            exit 1
          fi
          echo "Check passed: No sensitive .env file tracked in git."

  build:
    name: Build Test (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies via Homebrew
        run: |
          brew install cpr nlohmann-json yaml-cpp

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: |
          cmake --build build --config Release
